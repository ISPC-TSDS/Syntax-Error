<div class="section-header">
  <h2>Laboratorios disponibles</h2>
  <p>
    Consultá los laboratorios disponibles para realizar una reserva.
  </p>
</div>

<div class="table-responsive">

  <table class="table table-striped table-hover align-middle">

    <thead>
      <tr>
        <th>ID</th>
        <th>Laboratorio</th>
        <th>Capacidad</th>
        <th>Estado</th>
      </tr>
    </thead>

    <tbody>

      @for (espacio of espacios; track espacio.id) {

        <tr>

          <td>
            {{ espacio.id }}
          </td>

          <td>
            {{ espacio.nombre }}
          </td>

          <td>
            {{ espacio.capacidad }} estudiantes
          </td>

          <td>
            <span
              class="badge"
              [class.bg-success]="espacio.estado === 'Disponible'"
              [class.bg-danger]="espacio.estado === 'Ocupado'"
            >
              {{ espacio.estado }}
            </span>
          </td>

        </tr>

      }

    </tbody>

  </table>

</div>
