<div class="section-header">

  <h2>
    Historial de reservas
  </h2>

  <p>
    Visualizá las reservas realizadas anteriormente.
  </p>

</div>


<div class="table-responsive">

  <table class="table table-striped table-hover align-middle">

    <thead>

      <tr>
        <th>ID</th>
        <th>Laboratorio</th>
        <th>Fecha</th>
        <th>Hora</th>
        <th>Estado</th>
      </tr>

    </thead>

    <tbody>

      @for (reserva of historial; track reserva.id) {

        <tr>

          <td>
            {{ reserva.id }}
          </td>

          <td>
            {{ reserva.sala }}
          </td>

          <td>
            {{ reserva.fecha }}
          </td>

          <td>
            {{ reserva.hora }}
          </td>

          <td>
            {{ reserva.estado }}
          </td>

        </tr>

      }

    </tbody>

  </table>

</div>
