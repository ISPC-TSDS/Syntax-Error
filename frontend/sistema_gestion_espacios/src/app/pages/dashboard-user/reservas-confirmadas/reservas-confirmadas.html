<div class="section-header">
  <h2>Reservas Confirmadas</h2>

  <p>
    Consultá y administrá tus reservas actuales.
  </p>
</div>


<div class="table-responsive">

  <table class="table table-striped table-hover align-middle">

    <thead>
      <tr>
        <th>Sala</th>
        <th>Fecha Desde</th>
        <th>Fecha Hasta</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>

      @for (reserva of reservas; track reserva.sala) {

        <tr>

          <td>
            {{ reserva.sala }}
          </td>

          <td>
            {{ reserva.fechaDesde }}
          </td>

          <td>
            {{ reserva.fechaHasta }}
          </td>

          <td>

            <div class="d-flex gap-2">

              <button
                type="button"
                class="btn btn-warning btn-sm"
              >
                Modificar
              </button>

              <button
                type="button"
                class="btn btn-danger btn-sm"
              >
                Cancelar
              </button>

            </div>

          </td>

        </tr>

      }

    </tbody>

  </table>

</div>
